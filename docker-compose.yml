services:
  app:
    build: .
    ports:
      - "8500:80"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8500}
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      DATABASE_HOST: db
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_USER: ${DATABASE_USER:-shopware}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-shopware}
      DATABASE_NAME: ${DATABASE_NAME:-shopware}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-shopware}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME:-Demo}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME:-Admin}
      SHOP_LOCALE: ${SHOP_LOCALE:-en-GB}
      SHOP_CURRENCY: ${SHOP_CURRENCY:-EUR}
      SHOP_NAME: ${SHOP_NAME:-Demo Store}
    volumes:
      - ./shopware:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DATABASE_NAME:-shopware}
      MYSQL_USER: ${DATABASE_USER:-shopware}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-shopware}
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"]
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
